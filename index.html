<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Propose Day Surprise</title>
<style>
body {
    margin: 0;
    padding: 0;
    background: pink;
    font-family: 'Comic Sans MS', cursive, sans-serif;
    overflow: hidden;
    text-align: center;
}

h1 {
    margin-top: 50px;
    font-size: 2.5em;
    color: #fff;
    text-shadow: 2px 2px #ff69b4;
}

#bear {
    font-size: 100px;
    animation: bounce 1s infinite alternate;
    display: block;
    margin: 30px auto;
}

@keyframes bounce {
    0% { transform: translateY(0); }
    100% { transform: translateY(-20px); }
}

.btn-container {
    margin-top: 30px;
}

button {
    padding: 15px 30px;
    font-size: 1.2em;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    margin: 20px;
    transition: all 0.3s ease;
    background: #ff69b4;
    color: white;
    box-shadow: 2px 2px 5px #ff1493;
}

button:hover {
    transform: scale(1.1);
}

.hidden {
    display: none;
}

/* Falling emojis */
.fall {
    position: absolute;
    font-size: 30px;
    animation: fall linear infinite;
    pointer-events: none;
}

@keyframes fall {
    0% { transform: translateY(-50px); opacity: 1; }
    100% { transform: translateY(100vh); opacity: 0; }
}

#celebration-text {
    font-size: 2em;
    color: #fff;
    margin-top: 30px;
    text-shadow: 2px 2px #ff1493;
}

#hug-bears {
    font-size: 120px;
    margin-top: 20px;
    display: block;
}
</style>
</head>
<body>

<h1>Heyy Ammu, Will you be my Valentine??</h1>
<div id="bear">🐻</div>

<div class="btn-container">
    <button id="yesBtn">Yes</button>
    <button id="noBtn">No</button>
</div>

<div id="celebration" class="hidden">
    <h1 id="celebration-text">Knew you would say yes💗. I love you sooo much😚</h1>
    <div id="hug-bears">🐻🤍🐻</div>
</div>

<script>
const yesBtn = document.getElementById('yesBtn');
const noBtn = document.getElementById('noBtn');
let yesSize = 1;

noBtn.addEventListener('click', () => {
    yesSize += 0.2;
    yesBtn.style.transform = `scale(${yesSize})`;
});

yesBtn.addEventListener('click', () => {
    document.querySelector('h1').classList.add('hidden');
    document.getElementById('bear').classList.add('hidden');
    document.querySelector('.btn-container').classList.add('hidden');
    document.getElementById('celebration').classList.remove('hidden');
    startFalling();
});

function startFalling() {
    const total = 50; 
    for(let i=0; i<total; i++) {
        createFalling('💖');
        createFalling('🌹');
    }
}

function createFalling(emoji) {
    const el = document.createElement('div');
    el.classList.add('fall');
    el.textContent = emoji;
    el.style.left = Math.random() * 100 + 'vw';
    el.style.animationDuration = (3 + Math.random() * 5) + 's';
    document.body.appendChild(el);

    setTimeout(() => {
        el.remove();
    }, 8000);
}
</script>

</body>
</html>
